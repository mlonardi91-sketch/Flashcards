<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flashcards App</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .category-select {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-top: 15px;
            width: 240px;
        }
        .card-container {
            position: relative;
            width: 310px;
            height: 420px;
            perspective: 1000px;
        }
        .card {
            width: 100%;
            height: 100%;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            position: absolute;
            top: 0;
            left: 0;
            transition: transform 0.1s ease, opacity 0.2s ease;
            cursor: pointer;
        }
        .word-main {
            font-size: 32px;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 20px;
        }
        .word-translation {
            font-size: 20px;
            color: #555;
            margin: 6px 0;
            display: none;
        }
        .hint {
            position: absolute;
            bottom: 20px;
            font-size: 13px;
            color: #aaa;
        }
        .badge {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            background: #e9ecef;
            color: #495057;
            margin-bottom: 4px;
        }
        .controls {
            margin-top: 25px;
            display: flex;
            gap: 20px;
        }
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .btn-left { background-color: #ff4d4f; color: white; } /* Review Later */
        .btn-right { background-color: #52c41a; color: white; } /* I Know It */
        .btn-back {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #e0e0e0;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-reset {
            margin-top: 15px;
            background: none;
            border: none;
            color: #888;
            text-decoration: underline;
            cursor: pointer;
            font-size: 13px;
        }
        .stats {
            position: absolute;
            bottom: 20px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>

    <!-- Main Screen -->
    <div id="setupScreen" class="screen">
        <div class="header">
            <h2>Flashcards App</h2>
            <p id="uploadPrompt">Upload your Excel file to start</p>
            <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" />
        </div>

        <div id="categoryContainer" style="display:none; text-align:center;">
            <label for="categorySelect"><b>Select Category:</b></label><br>
            <select id="categorySelect" class="category-select"></select><br><br>
            <button class="btn btn-right" onclick="startStudy()">Start Review</button><br>
            <button class="btn-reset" onclick="resetCurrentCategoryProgress()">Reset Category Progress</button>
        </div>
    </div>

    <!-- Study Screen -->
    <div id="studyScreen" class="screen" style="display:none;">
        <button class="btn-back" onclick="goBack()">← Categories</button>

        <div class="card-container" id="cardContainer">
            <div class="card" id="flashcard">
                <div class="word-main" id="wordEnglish">Word</div>
                
                <div class="badge">Italian</div>
                <div class="word-translation" id="wordItalian">Translation</div>
                
                <div class="badge" style="margin-top: 10px;">German</div>
                <div class="word-translation" id="wordGerman">Translation</div>

                <div class="hint" id="hintText">Tap to reveal meaning</div>
            </div>
        </div>

        <div class="controls" id="controls">
            <button class="btn btn-left" onclick="handleSwipe('left')">← Review Later</button>
            <button class="btn btn-right" onclick="handleSwipe('right')">I Know It →</button>
        </div>
    </div>

    <div class="stats" id="stats"></div>

    <script>
        let allWords = [];
        let currentDeck = [];
        let currentIndex = 0;
        let isRevealed = false;

        // Auto-load previously saved words from LocalStorage if available
        window.addEventListener('DOMContentLoaded', () => {
            const savedData = localStorage.getItem('flashcard_words');
            if (savedData) {
                allWords = JSON.parse(savedData);
                populateCategories();
                document.getElementById('uploadPrompt').innerText = "Word list loaded from memory. You can upload a new file to overwrite.";
            }
        });

        document.getElementById('excelFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(worksheet);

                allWords = jsonData.map((row, index) => ({
                    id: index,
                    cat: row['Categoria'] || row['categoria'] || Object.values(row)[0] || 'General',
                    en: row['Inglese'] || row['inglese'] || Object.values(row)[1],
                    it: row['Italiano'] || row['italiano'] || Object.values(row)[2],
                    de: row['Tedesco'] || row['tedesco'] || Object.values(row)[3],
                    learned: false
                })).filter(item => item.en);

                if (allWords.length > 0) {
                    saveToLocalStorage();
                    populateCategories();
                } else {
                    alert('No valid word list found in the Excel file.');
                }
            };
            reader.readAsArrayBuffer(file);
        });

        function saveToLocalStorage() {
            localStorage.setItem('flashcard_words', JSON.stringify(allWords));
        }

        function populateCategories() {
            const categories = [...new Set(allWords.map(w => w.cat))];
            const select = document.getElementById('categorySelect');
            select.innerHTML = '<option value="ALL">All Categories</option>';
            
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.innerText = cat;
                select.appendChild(opt);
            });

            document.getElementById('categoryContainer').style.display = 'block';
        }

        function startStudy() {
            const selectedCat = document.getElementById('categorySelect').value;
            
            // Filter out words that are already learned!
            if (selectedCat === 'ALL') {
                currentDeck = allWords.filter(w => !w.learned);
            } else {
                currentDeck = allWords.filter(w => w.cat === selectedCat && !w.learned);
            }

            currentIndex = 0;
            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('studyScreen').style.display = 'flex';
            showCard();
        }

        function showCard() {
            if (currentIndex >= currentDeck.length) {
                document.getElementById('cardContainer').style.display = 'none';
                document.getElementById('controls').style.display = 'none';
                document.getElementById('stats').innerText = '🎉 Congratulations! Category completed!';
                return;
            }

            document.getElementById('cardContainer').style.display = 'block';
            document.getElementById('controls').style.display = 'flex';

            const current = currentDeck[currentIndex];
            document.getElementById('wordEnglish').innerText = current.en;
            document.getElementById('wordItalian').innerText = current.it || '-';
            document.getElementById('wordGerman').innerText = current.de || '-';

            isRevealed = false;
            toggleTranslations(false);

            const card = document.getElementById('flashcard');
            card.style.transform = 'translate(0, 0) rotate(0deg)';
            card.style.opacity = '1';

            updateStats();
        }

        function toggleTranslations(show) {
            const translations = document.querySelectorAll('.word-translation');
            translations.forEach(el => el.style.display = show ? 'block' : 'none');
            document.getElementById('hintText').style.display = show ? 'none' : 'block';
        }

        document.getElementById('flashcard').addEventListener('click', function() {
            isRevealed = !isRevealed;
            toggleTranslations(isRevealed);
        });

        function handleSwipe(direction) {
            const card = document.getElementById('flashcard');
            const xOffset = direction === 'right' ? 500 : -500;
            const rotateDeg = direction === 'right' ? 20 : -20;

            card.style.transform = `translate(${xOffset}px, 0) rotate(${rotateDeg}deg)`;
            card.style.opacity = '0';

            setTimeout(() => {
                if (direction === 'right') {
                    // SWIPE RIGHT (Tinder Like): Mark word as learned permanently
                    const currentWord = currentDeck[currentIndex];
                    const mainWord = allWords.find(w => w.id === currentWord.id);
                    if (mainWord) mainWord.learned = true;
                    
                    saveToLocalStorage();
                    currentDeck.splice(currentIndex, 1);
                } else {
                    // SWIPE LEFT (Tinder Pass): Move to end of queue to review again
                    const wrongWord = currentDeck.splice(currentIndex, 1)[0];
                    currentDeck.push(wrongWord);
                }
                showCard();
            }, 200);
        }

        // Touch Swipe Gestures for Mobile
        let startX = 0;
        const card = document.getElementById('flashcard');

        card.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; });
        card.addEventListener('touchend', (e) => {
            const diffX = e.changedTouches[0].clientX - startX;
            if (Math.abs(diffX) > 50) {
                handleSwipe(diffX > 0 ? 'right' : 'left');
            }
        });

        function resetCurrentCategoryProgress() {
            const selectedCat = document.getElementById('categorySelect').value;
            if (confirm(`Reset progress for ${selectedCat === 'ALL' ? 'all categories' : selectedCat}?`)) {
                allWords.forEach(w => {
                    if (selectedCat === 'ALL' || w.cat === selectedCat) {
                        w.learned = false;
                    }
                });
                saveToLocalStorage();
                alert('Progress reset successfully!');
            }
        }

        function goBack() {
            document.getElementById('studyScreen').style.display = 'none';
            document.getElementById('setupScreen').style.display = 'flex';
            document.getElementById('stats').innerText = '';
        }

        function updateStats() {
            document.getElementById('stats').innerText = `Cards remaining: ${currentDeck.length - currentIndex}`;
        }
    </script>
</body>
</html>
