<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flashcards App</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .category-select {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-top: 15px;
            width: 220px;
        }
        .card-container {
            position: relative;
            width: 320px;
            height: 420px;
            perspective: 1000px;
        }
        .card {
            width: 100%;
            height: 100%;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            position: absolute;
            top: 0;
            left: 0;
            transition: transform 0.1s ease, opacity 0.2s ease, background-color 0.3s ease;
            cursor: pointer;
        }

        /* 3 Colori Scheda */
        .card.card-noun {
            background-color: #e6f7ff; /* Azzurro per i Nomi */
            border: 2px solid #91d5ff;
        }
        .card.card-verb {
            background-color: #fff1f0; /* Rosso chiaro per i Verbi */
            border: 2px solid #ffa39e;
        }
        .card.card-adjective {
            background-color: #f6ffed; /* Verde chiaro per gli Aggettivi */
            border: 2px solid #b7eb8f;
        }

        .word-type-tag {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 12px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 12px;
            text-transform: uppercase;
        }
        .card-noun .word-type-tag { background: #bae7ff; color: #0050b3; }
        .card-verb .word-type-tag { background: #ffccc7; color: #a8071a; }
        .card-adjective .word-type-tag { background: #d9f7be; color: #237804; }

        .word-main {
            font-size: 30px;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 20px;
        }
        .word-translation {
            font-size: 20px;
            color: #434343;
            margin: 6px 0;
            display: none;
        }
        .hint {
            position: absolute;
            bottom: 20px;
            font-size: 13px;
            color: #8c8c8c;
        }
        .badge {
            font-size: 11px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.06);
            color: #595959;
            margin-bottom: 2px;
        }
        .controls {
            margin-top: 30px;
            display: flex;
            gap: 20px;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .btn-wrong { background-color: #ff4d4f; color: white; }
        .btn-correct { background-color: #52c41a; color: white; }
        .btn-back {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #e0e0e0;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
        }
        .stats {
            position: absolute;
            bottom: 20px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>

    <div id="setupScreen" class="screen">
        <div class="header">
            <h2>Flashcards</h2>
            <input type="file" id="excelFile" class="file-input" accept=".xlsx, .xls" />
        </div>

        <div id="categoryContainer" style="display:none; text-align:center;">
            <label for="categorySelect"><b>Scegli una categoria:</b></label><br>
            <select id="categorySelect" class="category-select"></select><br><br>
            <button class="btn btn-correct" onclick="startStudy()">Inizia Ripasso</button>
        </div>
    </div>

    <div id="studyScreen" class="screen" style="display:none;">
        <button class="btn-back" onclick="goBack()">← Categorie</button>

        <div class="card-container" id="cardContainer">
            <div class="card" id="flashcard">
                <div class="word-type-tag" id="wordTypeTag">NOME</div>

                <div class="word-main" id="wordEnglish">Word</div>
                
                <div class="badge">Italiano</div>
                <div class="word-translation" id="wordItalian">Traduzione</div>
                
                <div class="badge" style="margin-top: 10px;">Tedesco</div>
                <div class="word-translation" id="wordGerman">Traduzione</div>

                <div class="hint" id="hintText">Tocca per mostrare il significato</div>
            </div>
        </div>

        <div class="controls" id="controls">
            <button class="btn btn-wrong" onclick="handleSwipe('left')">← Sbagliata</button>
            <button class="btn btn-correct" onclick="handleSwipe('right')">Corretta →</button>
        </div>
    </div>

    <div class="stats" id="stats"></div>

    <script>
        let allWords = [];
        let currentDeck = [];
        let currentIndex = 0;
        let isRevealed = false;

        document.getElementById('excelFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(worksheet);

                allWords = jsonData.map(row => {
                    const rawType = (row['Tipo'] || row['tipo'] || '').toString().trim().toLowerCase();
                    
                    let type = 'nome';
                    if (rawType.includes('verbo') || rawType === 'v') {
                        type = 'verbo';
                    } else if (rawType.includes('agg') || rawType === 'adj') {
                        type = 'aggettivo';
                    }

                    return {
                        cat: row['Categoria'] || row['categoria'] || 'Generale',
                        type: type,
                        en: row['Inglese'] || row['inglese'] || '',
                        it: row['Italiano'] || row['italiano'] || '',
                        de: row['Tedesco'] || row['tedesco'] || ''
                    };
                }).filter(item => item.en);

                if (allWords.length > 0) {
                    populateCategories();
                } else {
                    alert('Nessun dato trovato nel file Excel.');
                }
            };
            reader.readAsArrayBuffer(file);
        });

        function populateCategories() {
            const categories = [...new Set(allWords.map(w => w.cat))];
            const select = document.getElementById('categorySelect');
            select.innerHTML = '<option value="ALL">Tutte le categorie</option>';
            
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.innerText = cat;
                select.appendChild(opt);
            });

            document.getElementById('categoryContainer').style.display = 'block';
        }

        function startStudy() {
            const selectedCat = document.getElementById('categorySelect').value;
            
            if (selectedCat === 'ALL') {
                currentDeck = [...allWords];
            } else {
                currentDeck = allWords.filter(w => w.cat === selectedCat);
            }

            currentIndex = 0;
            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('studyScreen').style.display = 'flex';
            showCard();
        }

        function showCard() {
            if (currentIndex >= currentDeck.length) {
                document.getElementById('cardContainer').style.display = 'none';
                document.getElementById('controls').style.display = 'none';
                document.getElementById('stats').innerText = 'Hai completato questa categoria!';
                return;
            }

            document.getElementById('cardContainer').style.display = 'block';
            document.getElementById('controls').style.display = 'flex';

            const current = currentDeck[currentIndex];
            const card = document.getElementById('flashcard');
            const typeTag = document.getElementById('wordTypeTag');

            // Imposta classe per colore e label
            card.classList.remove('card-noun', 'card-verb', 'card-adjective');

            if (current.type === 'verbo') {
                card.classList.add('card-verb');
                typeTag.innerText = 'VERBO';
            } else if (current.type === 'aggettivo') {
                card.classList.add('card-adjective');
                typeTag.innerText = 'AGGETTIVO';
            } else {
                card.classList.add('card-noun');
                typeTag.innerText = 'NOME';
            }

            document.getElementById('wordEnglish').innerText = current.en;
            document.getElementById('wordItalian').innerText = current.it || '-';
            document.getElementById('wordGerman').innerText = current.de || '-';

            isRevealed = false;
            toggleTranslations(false);

            card.style.transform = 'translate(0, 0) rotate(0deg)';
            card.style.opacity = '1';

            updateStats();
        }

        function toggleTranslations(show) {
            const translations = document.querySelectorAll('.word-translation');
            translations.forEach(el => el.style.display = show ? 'block' : 'none');
            document.getElementById('hintText').style.display = show ? 'none' : 'block';
        }

        document.getElementById('flashcard').addEventListener('click', function() {
            isRevealed = !isRevealed;
            toggleTranslations(isRevealed);
        });

        function handleSwipe(direction) {
            const card = document.getElementById('flashcard');
            const xOffset = direction === 'right' ? 500 : -500;
            const rotateDeg = direction === 'right' ? 20 : -20;

            card.style.transform = `translate(${xOffset}px, 0) rotate(${rotateDeg}deg)`;
            card.style.opacity = '0';

            setTimeout(() => {
                if (direction === 'left') {
                    const wrongWord = currentDeck.splice(currentIndex, 1)[0];
                    currentDeck.push(wrongWord);
                } else {
                    currentIndex++;
                }
                showCard();
            }, 200);
        }

        let startX = 0;
        const card = document.getElementById('flashcard');

        card.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; });
        card.addEventListener('touchend', (e) => {
            const diffX = e.changedTouches[0].clientX - startX;
            if (Math.abs(diffX) > 50) {
                handleSwipe(diffX > 0 ? 'right' : 'left');
            }
        });

        function goBack() {
            document.getElementById('studyScreen').style.display = 'none';
            document.getElementById('setupScreen').style.display = 'flex';
            document.getElementById('stats').innerText = '';
        }

        function updateStats() {
            document.getElementById('stats').innerText = `Rimanenti: ${currentDeck.length - currentIndex}`;
        }
    </script>
</body>
</html>
